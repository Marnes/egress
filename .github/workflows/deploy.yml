name: Deploy

# Ships main to production (egress.co.za). The image is built here on GitHub's
# runners and pulled by the server, so the bundler never runs on the VPS --
# that box has ~3.8GB RAM shared with several other production stacks.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race for the same container.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/marnes/egress

jobs:
  # Reuses ci.yml so a deploy can never ship code that fails the suite,
  # including manual workflow_dispatch runs.
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A commit-pinned tag so the deploy step ships an exact, known image
      # rather than whatever `latest` happens to point at mid-run.
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            VITE_PUBLIC_URL=https://egress.co.za
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      # The VPS is reached over Tailscale, not its public IP. Some GitHub runner
      # IPs cannot reach the box on :22 at all -- the packets never arrive at
      # sshd, so it is filtering upstream of the host and nothing configured on
      # the server can fix it. WireGuard sidesteps that path entirely.
      #
      # The runner joins as an ephemeral, tagged node and drops off the tailnet
      # when the job ends.
      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned to the box's real host key under its tailnet name, so this
          # still verifies the host rather than trusting the network.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Everything happens over ONE ssh connection, and secrets travel on stdin
      # rather than as arguments, so they cannot be read out of `ps` on a box
      # that also runs other people's services.
      - name: Deploy
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail

          # Build the remote payload: env exports, then the compose file, then
          # the deploy script itself.
          {
            printf 'export GHCR_USER=%q\n' "$GHCR_USER"
            printf 'export GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
            printf 'export IMAGE_TAG=%q\n' "$IMAGE_TAG"
            printf 'mkdir -p /opt/egress\n'
            printf "cat > /opt/egress/docker-compose.prod.yml <<'COMPOSE_EOF'\n"
            cat docker-compose.prod.yml
            printf 'COMPOSE_EOF\n'
            cat .github/scripts/deploy-remote.sh
          } > "$RUNNER_TEMP/remote.sh"

          # ConnectTimeout keeps an unreachable runner from burning 2+ minutes
          # per attempt on the default TCP timeout.
          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )

          for attempt in 1 2 3; do
            if ssh "${ssh_opts[@]}" "$SSH_TARGET" 'bash -s' < "$RUNNER_TEMP/remote.sh"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Deploy attempt $attempt failed; retrying in $((attempt * 30))s"
              sleep $((attempt * 30))
            fi
          done

          echo "::error::Deploy failed after 3 attempts. Traffic goes over the" \
               "tailnet, so a connection timeout here means the box dropped off" \
               "Tailscale rather than the old public-IP filtering. Check" \
               "'tailscale status' on the box. See DEPLOY.md."
          exit 1
